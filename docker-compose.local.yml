services:
  postgres:
    image: postgres:16-alpine
    container_name: alexandria-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alexandria_dev
      POSTGRES_USER: alexandria_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD is required}
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
      - ./scripts/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alexandria_user -d alexandria_dev"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  garage:
    image: dxflrs/garage:v2.2.0
    container_name: alexandria-local-garage
    restart: unless-stopped
    environment:
      RUST_LOG: garage=info
    volumes:
      - ./garage.local.toml:/etc/garage.toml
      - garage_local_meta_data:/var/lib/garage/meta
      - garage_local_storage_data:/var/lib/garage/data
    networks:
      - app-net # nginx proxies S3 requests from browser
      - data-net # api and workers talk to it directly
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  garage-init:
    build:
      context: .
      dockerfile: scripts/garage-init/Dockerfile
    container_name: alexandria-garage-init
    restart: no
    depends_on:
      garage:
        condition: service_healthy
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - ./garage.local.toml:/etc/garage.toml:ro
      - garage_local_meta_data:/var/lib/garage/meta
      - ./init-output:/output
      - ./scripts/garage-init/cors.json:/config/cors.json:ro
    networks:
      - data-net

  rabbitmq-config:
    image: alpine:3.20
    container_name: alexandria-rabbitmq-config
    restart: "no"
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      API_RABBITMQ_USER: ${API_RABBITMQ_USER:?API_RABBITMQ_USER is required}
      API_RABBITMQ_PASS: ${API_RABBITMQ_PASSWORD:?API_RABBITMQ_PASSWORD is required}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-alexandria}
      DOCUMENT_WORKER_PASS: ${DOCUMENT_WORKER_RABBITMQ_PASSWORD:?DOCUMENT_WORKER_RABBITMQ_PASSWORD is required}
      MEDIA_WORKER_PASS: ${MEDIA_WORKER_RABBITMQ_PASSWORD:?MEDIA_WORKER_RABBITMQ_PASSWORD is required}
      TRANSPILATION_WORKER_PASS: ${TRANSPILATION_WORKER_RABBITMQ_PASSWORD:?TRANSPILATION_WORKER_RABBITMQ_PASSWORD is required}
      MEDIA_METADATA_WORKER_PASS: ${MEDIA_METADATA_WORKER_RABBITMQ_PASSWORD:?MEDIA_METADATA_WORKER_RABBITMQ_PASSWORD is required}
      LYRICS_WORKER_PASS: ${LYRICS_WORKER_RABBITMQ_PASSWORD:?LYRICS_WORKER_RABBITMQ_PASSWORD is required}
      ESSENTIA_WORKER_PASS: ${ESSENTIA_WORKER_RABBITMQ_PASSWORD:?ESSENTIA_WORKER_RABBITMQ_PASSWORD is required}
    volumes:
      - ./rabbitmq/definitions.template.json:/template/definitions.template.json:ro
      - rabbitmq_definitions:/output
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache gettext > /dev/null && envsubst < /template/definitions.template.json > /output/definitions.json

  rabbitmq:
    image: rabbitmq:4.2.5-management-alpine
    container_name: alexandria-local-rabbitmq
    restart: unless-stopped
    depends_on:
      rabbitmq-config:
        condition: service_completed_successfully
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dev_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-alexandria}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit log_levels [{connection,error},{default,error}] disk_free_limit 2147483648
    volumes:
      - rabbitmq_local_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq_definitions:/etc/rabbitmq/definitions:ro
    networks:
      - data-net
      - essentia-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:12.4.2
    container_name: alexandria-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_local_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    # no ports: — accessed via SSH tunnel: ssh -L 3000:localhost:3000 user@host
    # for dev since I work on the same machine :) in real deployment the comment above is valid
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - observability-net
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    profiles:
      - monitoring
      - default

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    container_name: alexandria-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_local_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - data-net
      - essentia-net
      - observability-net
    environment:
      - GARAGE_S3_METRICS_TOKEN=${GARAGE_S3_METRICS_TOKEN:?GARAGE_S3_METRICS_TOKEN is required}
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    profiles:
      - monitoring
      - default

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    container_name: alexandria-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 64M
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    profiles:
      - monitoring
      - default

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: alexandria-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:${DB_PORT:-5432}/${DB_NAME:?DB_NAME is required}?sslmode=disable"
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-net
      - observability-net
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    profiles:
      - monitoring
      - default

  alloy:
    image: grafana/alloy:v1.18.1@sha256:0f4434c92b3e6cdac38bb129b344e1790c246f7b6e2eaffcc16a5fa363240e33
    container_name: alexandria-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_local_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    profiles:
      - monitoring
      - default

  loki:
    image: grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    container_name: alexandria-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_local_data:/loki
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    profiles:
      - monitoring
      - default

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: alexandria-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy # ← wait for the healthcheck to pass
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    networks:
      - frontend-net # faces the outside world
      - app-net # reaches frontend, api, garage

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: alexandria-frontend
    restart: always
    environment:
      VITE_PBKDF2_ITERATIONS: ${PBKDF2_ITERATION_COUNT}
      VITE_STREAMING_ENABLED: ${STREAMING_ENABLED}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  api:
    build:
      context: ./Backend
      dockerfile: Alexandria.Api/Dockerfile
    container_name: alexandria-api
    labels:
      - "logs.collect=true"
    restart: on-failure:3
    environment:
      ConnectionStrings__AlexandriaPostgres: "Host=postgres;Port=${DB_PORT:?DB_PORT is required};Database=${DB_NAME:?DB_NAME is required};Username=${DB_USERNAME:?DB_USERNAME is required};Password=${DB_PASSWORD:?DB_PASSWORD is required}; GssEncryptionMode=Disable"
      S3Storage__AccessKey: ${GARAGE_S3_ACCESS_KEY:?GARAGE_S3_ACCESS_KEY is required}
      S3Storage__SecretKey: ${GARAGE_S3_SECRET_KEY:?GARAGE_S3_SECRET_KEY is required}
      S3Storage__PublicEndpoint: ${GARAGE_S3_PUBLIC_ENDPOINT:?GARAGE_S3_PUBLIC_ENDPOINT is required}
      S3Storage__ProviderSettings__Garage__MetricsToken: ${GARAGE_S3_METRICS_TOKEN:?GARAGE_S3_METRICS_TOKEN is required}
      S3Storage__BaseUrl: ${BASE_URL:?BASE_URL is required}
      RabbitMQ__UserName: ${API_RABBITMQ_USER:?API_RABBITMQ_USER is required}
      RabbitMQ__Password: ${API_RABBITMQ_PASSWORD:?API_RABBITMQ_PASSWORD is required}
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-alexandria}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      Csrf__SecretKey: ${CSRF_SECRET:?CSRF_SECRET is required}
      Features__Autotagging: "true"
      ADMIN__EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN__PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN__NAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      CORS_ALLOWED_ORIGINS__0: ${CORS_ALLOWED_ORIGINS__0:?CORS_ALLOWED_ORIGINS__0 is required}
      CORS_ALLOWED_ORIGINS__1: ${CORS_ALLOWED_ORIGINS__1:?CORS_ALLOWED_ORIGINS__1 is required}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      garage:
        condition: service_healthy
    networks:
      - app-net # nginx reaches it here
      - data-net # reaches postgres, garage, rabbitmq
      - observability-net # exposes /metrics to prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  document-worker:
    build:
      context: ./Backend
      dockerfile: Alexandria.Workers.Document/Dockerfile
    container_name: alexandria-document-worker
    labels:
      - "logs.collect=true"
    restart: always
    volumes:
      - document_worker_scratch:/tmp/worker-scratch
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__AlexandriaPostgres: "Host=postgres;Port=${DB_PORT:?DB_PORT is required};Database=${DB_NAME:?DB_NAME is required};Username=${DB_USERNAME:?DB_USERNAME is required};Password=${DB_PASSWORD:?DB_PASSWORD is required}"
      S3Storage__AccessKey: ${GARAGE_S3_WORKER_ACCESS_KEY:?GARAGE_S3_WORKER_ACCESS_KEY is required}
      S3Storage__SecretKey: ${GARAGE_S3_WORKER_SECRET_KEY:?GARAGE_S3_WORKER_SECRET_KEY is required}
      RabbitMQ__UserName: ${RABBITMQ_DOCUMENT_WORKER:?RABBITMQ_DOCUMENT_WORKER is required}
      RabbitMQ__Password: ${DOCUMENT_WORKER_RABBITMQ_PASSWORD:?DOCUMENT_WORKER_RABBITMQ_PASSWORD is required}
      S3Storage__PublicEndpoint: ${GARAGE_S3_PUBLIC_ENDPOINT:?GARAGE_S3_PUBLIC_ENDPOINT is required}
      ASPNETCORE_URLS: http://+:8080
      TMPDIR: /tmp/worker-scratch
      RabbitMQ__Consumer__QueueName: document-queue
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-alexandria}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      garage:
        condition: service_healthy
      rabbitmq-config:
        condition: service_completed_successfully
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: ${DOCUMENT_WORKER_MEMORY_LIMIT:-1G}
        reservations:
          memory: ${DOCUMENT_WORKER_MEMORY_RESERVATION:-256M}

  media-worker:
    build:
      context: ./Backend
      dockerfile: Alexandria.Workers.Media/Dockerfile
    container_name: alexandria-media-worker
    labels:
      - "logs.collect=true"
    restart: always
    volumes:
      - media_worker_scratch:/tmp/worker-scratch
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__AlexandriaPostgres: "Host=postgres;Port=${DB_PORT:?DB_PORT is required};Database=${DB_NAME:?DB_NAME is required};Username=${DB_USERNAME:?DB_USERNAME is required};Password=${DB_PASSWORD:?DB_PASSWORD is required}"
      S3Storage__AccessKey: ${GARAGE_S3_WORKER_ACCESS_KEY:?GARAGE_S3_WORKER_ACCESS_KEY is required}
      S3Storage__SecretKey: ${GARAGE_S3_WORKER_SECRET_KEY:?GARAGE_S3_WORKER_SECRET_KEY is required}
      RabbitMQ__UserName: ${RABBITMQ_MEDIA_WORKER:?RABBITMQ_MEDIA_WORKER is required}
      RabbitMQ__Password: ${MEDIA_WORKER_RABBITMQ_PASSWORD:?MEDIA_WORKER_RABBITMQ_PASSWORD is required}
      S3Storage__PublicEndpoint: ${GARAGE_S3_PUBLIC_ENDPOINT:?GARAGE_S3_PUBLIC_ENDPOINT is required}
      ASPNETCORE_URLS: http://+:8080
      TMPDIR: /tmp/worker-scratch
      RabbitMQ__Consumer__QueueName: media-queue
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-alexandria}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      garage:
        condition: service_healthy
      rabbitmq-config:
        condition: service_completed_successfully
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  transpilation-worker:
    build:
      context: ./Backend
      dockerfile: Alexandria.Workers.MediaTranspilation/Dockerfile
    container_name: alexandria-transpilation-worker
    labels:
      - "logs.collect=true"
    restart: always
    volumes:
      - transpilation_worker_scratch:/tmp/worker-scratch
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__AlexandriaPostgres: "Host=postgres;Port=${DB_PORT:?DB_PORT is required};Database=${DB_NAME:?DB_NAME is required};Username=${DB_USERNAME:?DB_USERNAME is required};Password=${DB_PASSWORD:?DB_PASSWORD is required}"
      S3Storage__AccessKey: ${GARAGE_S3_TRANSPILATION_WORKER_ACCESS_KEY:?GARAGE_S3_WORKER_ACCESS_KEY is required}
      S3Storage__SecretKey: ${GARAGE_S3_TRANSPILATION_WORKER_SECRET_KEY:?GARAGE_S3_WORKER_SECRET_KEY is required}
      RabbitMQ__UserName: ${RABBITMQ_TRANSPILATION_WORKER:?RABBITMQ_TRANSPILATION_WORKER is required}
      RabbitMQ__Password: ${TRANSPILATION_WORKER_RABBITMQ_PASSWORD:?TRANSPILATION_WORKER_RABBITMQ_PASSWORD is required}
      S3Storage__PublicEndpoint: ${GARAGE_S3_PUBLIC_ENDPOINT:?GARAGE_S3_PUBLIC_ENDPOINT is required}
      ASPNETCORE_URLS: http://+:8080
      TMPDIR: /tmp/worker-scratch
      RabbitMQ__Consumer__QueueName: transpilation-queue
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-alexandria}

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      garage:
        condition: service_healthy
      rabbitmq-config:
        condition: service_completed_successfully
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  media-metadata-worker:
    build:
      context: ./Backend
      dockerfile: Alexandria.Workers.MediaMetadata/Dockerfile
    container_name: alexandria-media-metadata-worker
    labels:
      - "logs.collect=true"
    restart: always
    volumes:
      - media_metadata_worker_scratch:/tmp/worker-scratch
      - media_audio_data:/data
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__AlexandriaPostgres: "Host=postgres;Port=${DB_PORT:?DB_PORT is required};Database=${DB_NAME:?DB_NAME is required};Username=${DB_USERNAME:?DB_USERNAME is required};Password=${DB_PASSWORD:?DB_PASSWORD is required}"
      S3Storage__AccessKey: ${GARAGE_S3_WORKER_ACCESS_KEY:?GARAGE_S3_WORKER_ACCESS_KEY is required}
      S3Storage__SecretKey: ${GARAGE_S3_WORKER_SECRET_KEY:?GARAGE_S3_WORKER_SECRET_KEY is required}
      S3Storage__PublicEndpoint: ${GARAGE_S3_PUBLIC_ENDPOINT:?GARAGE_S3_PUBLIC_ENDPOINT is required}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_MEDIA_METADATA_WORKER:?RABBITMQ_MEDIA_METADATA_WORKER is required}
      RabbitMQ__Password: ${MEDIA_METADATA_WORKER_RABBITMQ_PASSWORD:?MEDIA_METADATA_WORKER_RABBITMQ_PASSWORD is required}
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-alexandria}
      RabbitMQ__Consumer__ExchangeName: content-exchange
      RabbitMQ__Consumer__TriggerQueueName: media-metadata-trigger-queue
      RabbitMQ__Consumer__ResultsQueueName: media-metadata-results-queue
      Features__Autotagging: "true"
      Essentia__Backbone: effnet
      Essentia__StagedDir: /data/staged
      Essentia__OutputDir: /data/output
      Essentia__LocalVolumePath: /data
      Essentia__VolumeMountPath: /data
      ASPNETCORE_URLS: http://+:8080
      TMPDIR: /tmp/worker-scratch
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      garage:
        condition: service_healthy
      rabbitmq-config:
        condition: service_completed_successfully
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  lyrics-worker:
    build:
      context: ./Backend
      dockerfile: Alexandria.Workers.Lyrics/Dockerfile
    container_name: alexandria-lyrics-worker
    labels:
      - "logs.collect=true"
    restart: always
    volumes:
      - media_metadata_worker_scratch:/tmp/worker-scratch
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__AlexandriaPostgres: "Host=postgres;Port=${DB_PORT:?DB_PORT is required};Database=${DB_NAME:?DB_NAME is required};Username=${DB_USERNAME:?DB_USERNAME is required};Password=${DB_PASSWORD:?DB_PASSWORD is required}"
      S3Storage__AccessKey: ${GARAGE_S3_WORKER_ACCESS_KEY:?GARAGE_S3_WORKER_ACCESS_KEY is required}
      S3Storage__SecretKey: ${GARAGE_S3_WORKER_SECRET_KEY:?GARAGE_S3_WORKER_SECRET_KEY is required}
      RabbitMQ__UserName: ${RABBITMQ_LYRICS_WORKER:?RABBITMQ_LYRICS_WORKER is required}
      RabbitMQ__Password: ${LYRICS_WORKER_RABBITMQ_PASSWORD:?LYRICS_WORKER_RABBITMQ_PASSWORD is required}
      S3Storage__PublicEndpoint: ${GARAGE_S3_PUBLIC_ENDPOINT:?GARAGE_S3_PUBLIC_ENDPOINT is required}
      Features__Lyrics: ${LYRICS_ENABLED:?LYRICS_ENABLED is required}
      ASPNETCORE_URLS: http://+:8080
      TMPDIR: /tmp/worker-scratch
      RabbitMQ__Consumer__QueueName: lyrics-queue
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-alexandria}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      garage:
        condition: service_healthy
      rabbitmq-config:
        condition: service_completed_successfully
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  essentia-effnet-worker:
    build:
      context: ./classificators/essentia
      dockerfile: Dockerfile
    container_name: alexandria-essentia-effnet
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://essentia_worker_user:${ESSENTIA_WORKER_RABBITMQ_PASSWORD:?ESSENTIA_WORKER_RABBITMQ_PASSWORD is required}@rabbitmq:5672/${RABBITMQ_VHOST:-alexandria}
      EXCHANGE_NAME: content-exchange
      RESULT_ROUTING_KEY: media-metadata.completed
      QUEUE_NAME: classify-effnet-queue
      BACKBONE: effnet
      ESSENTIA_MODEL_DIR: /app/models
      VERIFY_MODELS: "true"
      PREFETCH_COUNT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
    volumes:
      - ./classificators/essentia/models:/app/models:ro
      - media_audio_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - essentia-net
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 2G

  essentia-maest-worker:
    build:
      context: ./classificators/essentia
      dockerfile: Dockerfile
    container_name: alexandria-essentia-maest
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://essentia_worker_user:${ESSENTIA_WORKER_RABBITMQ_PASSWORD:?ESSENTIA_WORKER_RABBITMQ_PASSWORD is required}@rabbitmq:5672/${RABBITMQ_VHOST:-alexandria}
      EXCHANGE_NAME: content-exchange
      RESULT_ROUTING_KEY: media-metadata.completed
      QUEUE_NAME: classify-maest-queue
      BACKBONE: maest
      ESSENTIA_MODEL_DIR: /app/models
      VERIFY_MODELS: "true"
      PREFETCH_COUNT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
    volumes:
      - ./classificators/essentia/models:/app/models:ro
      - media_audio_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - essentia-net
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 2G

volumes:
  postgres_local_data:
    driver: local
  garage_local_meta_data:
    driver: local
  garage_local_storage_data:
    driver: local
  rabbitmq_local_data:
    driver: local
  prometheus_local_data:
    driver: local
  grafana_local_data:
    driver: local
  document_worker_scratch:
    driver: local
  media_worker_scratch:
    driver: local
  transpilation_worker_scratch:
    driver: local
  media_metadata_worker_scratch:
      driver: local
  media_audio_data:
    driver: local
  rabbitmq_definitions:
    driver: local
