services:
  postgres:
    image: postgres:16-alpine
    container_name: alexandria-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: alexandria_dev
      POSTGRES_USER: alexandria_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - alexandria-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alexandria_user -d alexandria_dev"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  garage:
    image: dxflrs/garage:v2.2.0
    container_name: alexandria-garage-dev
    restart: unless-stopped
    environment:
      RUST_LOG: garage=info
    volumes:
      - ./garage.toml:/etc/garage.toml
      - garage_meta_data:/var/lib/garage/meta
      - garage_storage_data:/var/lib/garage/data
    ports:
      - "9000:3900" # S3 API (mapped to 9000 for compatibility)
      - "9001:3903" # Admin API (mapped to 9001 for compatibility)
      - "3901:3901" # RPC
      - "3902:3902" # S3 Web (optional)
    networks:
      - alexandria-network
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: alexandria-nginx-dev
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      garage:
        condition: service_healthy
 


  rabbitmq-config:
    image: alpine:3.20
    container_name: alexandria-rabbitmq-config-dev
    restart: "no"
    environment:
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-alexandria}
      API_RABBITMQ_USER: ${API_RABBITMQ_USER:?API_RABBITMQ_USER is required}
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      API_RABBITMQ_PASS: ${API_RABBITMQ_PASSWORD:?API_RABBITMQ_PASSWORD is required}
      DOCUMENT_WORKER_PASS: ${DOCUMENT_WORKER_RABBITMQ_PASSWORD:-dev_password_123}
      MEDIA_WORKER_PASS: ${MEDIA_WORKER_RABBITMQ_PASSWORD:-dev_password_123}
      TRANSPILATION_WORKER_PASS: ${TRANSPILATION_WORKER_RABBITMQ_PASSWORD:-dev_password_123}
      MEDIA_METADATA_WORKER_PASS: ${MEDIA_METADATA_WORKER_RABBITMQ_PASSWORD:-dev_password_123}
    volumes:
      - ./rabbitmq/definitions.template.json:/template/definitions.template.json:ro
      - rabbitmq_definitions_dev:/output
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache gettext > /dev/null && envsubst < /template/definitions.template.json > /output/definitions.json

  rabbitmq:
    image: rabbitmq:4.2.5-management-alpine
    container_name: alexandria-rabbitmq-dev
    restart: unless-stopped
    depends_on:
      rabbitmq-config:
        condition: service_completed_successfully
    environment:
      # RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      # RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-alexandria}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit log_levels [{connection,error},{default,error}] disk_free_limit 2147483648
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_definitions_dev:/etc/rabbitmq/definitions:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - alexandria-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_dev_data:
    driver: local
  garage_meta_data:
    driver: local
  garage_storage_data:
    driver: local
  rabbitmq_dev_data:
    driver: local
  rabbitmq_definitions_dev:
    driver: local
networks:
  alexandria-network:
    driver: bridge