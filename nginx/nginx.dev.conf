user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    limit_req_zone $binary_remote_addr zone=s3:10m rate=6000r/m;
    limit_conn_zone $binary_remote_addr zone=s3_conn:10m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=thumb:10m rate=3000r/m;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    client_max_body_size 500M;
    http2 on;

    proxy_cache_path /var/cache/nginx/previews levels=1:2 keys_zone=previews_cache:50m max_size=5g inactive=30d use_temp_path=off;

    server {
        listen 8080;
        server_name _;

        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/self-signed.crt;
        ssl_certificate_key /etc/nginx/certs/self-signed.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        # Dev CSP is intentionally looser than prod on script-src: prod pins a
        # sha256 hash of the built bundle, which will never match Vite's dev
        # scripts (inline HMR client, eval-based module loading). Everything
        # else mirrors prod so header-driven bugs (blocked workers/fonts/wasm)
        # still show up locally instead of only in staging.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self';" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://127.0.0.1:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 500M;
        }

        # Same thumbnail fast-path as prod: this needs the higher "thumb"
        # rate limit, not the general "api" one, or a thumbnail-heavy UI
        # gets rate limited in dev but not in prod.
        location ~ ^/api/files/[0-9a-fA-F-]+(/versions/[0-9a-fA-F-]+)?/(preview|thumbnail)$ {
            limit_req zone=thumb burst=300 nodelay;
            proxy_pass http://127.0.0.1:5000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # internal subrequest target for stream auth, not reachable directly from outside
        location = /api/auth/stream-check {
            internal;
            proxy_pass http://127.0.0.1:5000/api/auth/stream-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        location = /api/auth/preview-check {
            internal;
            proxy_pass http://127.0.0.1:5000/api/auth/preview-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        # DASH streaming, session-gated via auth_request, proxied straight to
        # Garage's web endpoint (port 3902), same as prod
        location /stream/ {
            auth_request /api/auth/stream-check;

            rewrite ^/stream/(.*)$ /$1 break;

            proxy_pass http://127.0.0.1:3902;
            proxy_set_header Host alexandria-streaming.web.garage.localhost;

            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_pass_header Content-Range;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
        }

        # previews/thumbnails, cached, same target port/host as prod (3902,
        # the website-enabled bucket) - not 3900, which needs signed S3 auth
        location ~ ^/preview/(?<version_id>[0-9a-fA-F-]+)/(?<kind>preview|thumbnail)$ {
            auth_request /api/auth/preview-check;
            auth_request_set $content_path $upstream_http_x_content_path;

            limit_conn s3_conn 300;

            proxy_cache previews_cache;
            proxy_cache_key "$scheme$host$content_path";
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_valid 500 502 503 504 5s;

            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_lock_age 10s;

            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;

            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://127.0.0.1:3902/$content_path;
            proxy_set_header Host alexandria-previews.web.garage.localhost;
            client_max_body_size 500M;
            proxy_read_timeout 300s;
        }

        location ~ ^/alexandria-images/ {
            limit_conn s3_conn 300;
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            client_max_body_size 500M;
            proxy_read_timeout 300s;
        }

        location ~ ^/(alexandria-files|alexandria-temp)/ {
            limit_conn s3_conn 300;
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            client_max_body_size 500M;
            proxy_read_timeout 300s;
        }

        # Vite dev server: HMR needs the Upgrade/Connection headers, and
        # since this is now same-origin (https://localhost) there's no CORS
        # to configure on the API side for local dev either.
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
